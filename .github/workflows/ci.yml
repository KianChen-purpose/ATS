name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pats
          POSTGRES_PASSWORD: pats
          POSTGRES_DB: pats
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pats:pats@localhost:5432/pats
      TEST_DATABASE_URL: postgres://pats:pats@localhost:5432/pats_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Migration drift check
        run: npm run db:check
      - name: Migrations apply cleanly
        run: npm run db:migrate
      - name: Tests
        run: npm test
      - name: Dependency scan
        run: npm audit --omit=dev --audit-level=high
